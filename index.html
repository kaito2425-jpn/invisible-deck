<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0a" />
  <title> </title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="stage">
    <div id="card" class="card">
      <div class="card-face card-front" id="card-front"></div>
      <div class="card-face card-back" id="card-back"></div>
    </div>

    <div id="hotspot-layer" aria-hidden="true"></div>

    <div id="debug-panel" hidden>
      <div class="debug-row"><span class="debug-label">state</span><span id="dbg-state">-</span></div>
      <div class="debug-row"><span class="debug-label">encoded</span><span id="dbg-encoded">-</span></div>
      <div class="debug-row"><span class="debug-label">idx/back</span><span id="dbg-idx">-</span></div>
      <div class="debug-row"><span class="debug-label">last swipe</span><span id="dbg-swipe">-</span></div>
    </div>

    <button id="tap-flip" type="button" aria-label="flip">FLIP (tap)</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
